# Traefik dynamic configuration.
#
# The edge router forwards every /api request through the rate-limit check
# (ForwardAuth -> gateway:8099/auth) BEFORE it reaches the modular monolith.
# If the check returns 200 the request is forwarded; if it returns 429 the
# response is returned to the client untouched.
http:
  routers:
    api-gateway:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - web
      service: modular-monolith
      middlewares:
        - rate-limit-auth

    dashboard:
      rule: "Host(`localhost`) && PathPrefix(`/dashboard`)"
      entryPoints:
        - dashboard
      service: api@internal

  middlewares:
    # Calls the Go rate-limit check service for every request. On 2xx the
    # request passes; on 429 it is rejected before touching the app servers.
    rate-limit-auth:
      forwardAuth:
        address: "http://gateway:8099/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - X-RateLimit-Limit
          - X-RateLimit-Remaining
          - Retry-After

  services:
    # The modular monolith's protected module endpoints live behind the gateway.
    modular-monolith:
      loadBalancer:
        servers:
          - url: "http://gateway:8098"